<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap');
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #8055EE; text-decoration: none; }
    a:hover { color: #5C7FF5; }
  </style>
</helmet>

<div style="width: 1440px; min-height: 1000px; font-family: 'Nunito', system-ui, sans-serif; color: #161240; background: linear-gradient(180deg,#eaf6ef,#FFF6E6 320px);">

  <!-- slim run bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 48px; border-bottom: 2px solid rgba(22,18,64,.08);">
    <div style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; color: rgba(22,18,64,.6);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(22,18,64,.6)" stroke-width="2.6" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      Mavzularga qaytish
    </div>
    <div style="font-weight: 800; font-size: 14px; color: rgba(22,18,64,.5);">1-sinf · I chorak · Blok 7 · 1-daraja</div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid rgba(22,18,64,.12); font-family: 'Baloo 2'; font-weight: 800;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFDF6E" stroke="#e0b400" stroke-width="1.5"><path d="M12 3l2.7 6.3L21 10l-5 4.3L17.5 21 12 17.5 6.5 21 8 14.3 3 10l6.3-.7L12 3Z"/></svg>
      60
    </div>
  </div>

  <!-- centered card -->
  <div style="display: flex; justify-content: center; padding: 56px 0 80px;">
    <div style="width: 660px;">

      <!-- progress -->
      <div style="display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 14px; color: rgba(22,18,64,.55); margin-bottom: 10px;">
        <span>Savol 4 / 10</span>
        <span style="display: flex; align-items: center; gap: 6px; color: #2f9d57;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2f9d57" stroke-width="3" stroke-linecap="round"><path d="M12 3v4M12 17v4M5 12H1M23 12h-4M6 6L4 4M18 6l2-2M6 18l-2 2M18 18l2 2"/></svg>
          Ketma-ket 3
        </span>
      </div>
      <div style="height: 10px; border-radius: 999px; background: rgba(22,18,64,.10); overflow: hidden; margin-bottom: 28px;">
        <div style="width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg,#4AD07A,#2F8A55);"></div>
      </div>

      <!-- question card -->
      <div style="border-radius: 26px; background: #fff; border: 2px solid rgba(22,18,64,.10); box-shadow: 0 10px 0 rgba(22,18,64,.12); padding: 44px 40px;">
        <div style="text-align: center; font-weight: 800; font-size: 13px; color: rgba(22,18,64,.4); letter-spacing: .5px;">HISOBLANG</div>
        <div style="font-family: 'Baloo 2', system-ui; font-weight: 800; font-size: 60px; text-align: center; margin: 14px 0 40px;">7 + 5 = ?</div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div style="padding: 20px; border-radius: 20px; background: #4AD07A; color: #06351c; text-align: center; font-family: 'Baloo 2'; font-weight: 800; font-size: 30px; box-shadow: 0 6px 0 #2f9d57;">12</div>
          <div style="padding: 20px; border-radius: 20px; background: #FFF6E6; border: 2px solid rgba(22,18,64,.14); text-align: center; font-family: 'Baloo 2'; font-weight: 800; font-size: 30px;">11</div>
          <div style="padding: 20px; border-radius: 20px; background: #FFF6E6; border: 2px solid rgba(22,18,64,.14); text-align: center; font-family: 'Baloo 2'; font-weight: 800; font-size: 30px;">13</div>
        </div>
      </div>

      <div style="text-align: center; font-weight: 700; font-size: 13px; color: rgba(22,18,64,.4); margin-top: 20px;">
        Javobni bosing — keyingi savolga o'zi o'tadi. Vaqt chegarasi yo'q.
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
