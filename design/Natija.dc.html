<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap');
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #FFF6E6; text-decoration: underline; }
    a:hover { color: #FFDF6E; }
  </style>
</helmet>

<div style="width: 1440px; min-height: 1000px; font-family: 'Nunito', system-ui, sans-serif; color: #161240; background: radial-gradient(circle at 50% 30%, #7FD6FF, #4FC0F7 45%, #2F8A55);">

  <div style="display: flex; justify-content: center; padding: 80px 0;">
    <div style="width: 620px;">

      <div style="text-align: center; color: #FFF6E6;">
        <div style="font-family: 'Baloo 2', system-ui; font-weight: 800; font-size: 44px;">Bosqich tugadi!</div>
      </div>

      <!-- stars -->
      <div style="display: flex; justify-content: center; gap: 14px; margin: 24px 0 28px;">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="#FFDF6E" stroke="#e0b400" stroke-width="1.4"><path d="M12 3l2.7 6.3L21 10l-5 4.3L17.5 21 12 17.5 6.5 21 8 14.3 3 10l6.3-.7L12 3Z"/></svg>
        <svg width="56" height="56" viewBox="0 0 24 24" fill="#FFDF6E" stroke="#e0b400" stroke-width="1.4"><path d="M12 3l2.7 6.3L21 10l-5 4.3L17.5 21 12 17.5 6.5 21 8 14.3 3 10l6.3-.7L12 3Z"/></svg>
        <svg width="56" height="56" viewBox="0 0 24 24" fill="rgba(255,255,255,.25)" stroke="rgba(255,255,255,.5)" stroke-width="1.4"><path d="M12 3l2.7 6.3L21 10l-5 4.3L17.5 21 12 17.5 6.5 21 8 14.3 3 10l6.3-.7L12 3Z"/></svg>
      </div>

      <!-- score / record -->
      <div style="text-align: center; color: #FFF6E6; margin-bottom: 26px;">
        <div style="font-family: 'Baloo 2'; font-weight: 800; font-size: 26px;">Ochko: 84</div>
        <div style="font-weight: 800; font-size: 15px; color: #FFDF6E; margin-top: 4px;">Yangi rekord!</div>
      </div>

      <!-- stat grid -->
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 26px;">
        <div style="border-radius: 18px; background: rgba(255,246,230,.16); backdrop-filter: blur(4px); padding: 18px 12px; text-align: center; color: #FFF6E6;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF6E6" stroke-width="2.4" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
          <div style="font-family: 'Baloo 2'; font-weight: 800; font-size: 22px; margin-top: 6px;">9</div>
          <div style="font-weight: 700; font-size: 11px; opacity: .8;">To'g'ri javoblar</div>
        </div>
        <div style="border-radius: 18px; background: rgba(255,246,230,.16); padding: 18px 12px; text-align: center; color: #FFF6E6;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF6E6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1.5 3 4 4.5 4 8a4 4 0 0 1-8 0c0-1.2.4-2 1-3-.2 2 1 3 1 3s-.5-4 2-8Z"/><path d="M8 14c0 3 1.8 6 4 6s4-3 4-6"/></svg>
          <div style="font-family: 'Baloo 2'; font-weight: 800; font-size: 22px; margin-top: 6px;">×6</div>
          <div style="font-weight: 700; font-size: 11px; opacity: .8;">Eng uzun ketma-ketlik</div>
        </div>
        <div style="border-radius: 18px; background: rgba(255,246,230,.16); padding: 18px 12px; text-align: center; color: #FFF6E6;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF6E6" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M12 5V3M9 3h6"/></svg>
          <div style="font-family: 'Baloo 2'; font-weight: 800; font-size: 22px; margin-top: 6px;">3.4s</div>
          <div style="font-weight: 700; font-size: 11px; opacity: .8;">O'rtacha vaqt</div>
        </div>
      </div>

      <!-- buttons -->
      <div style="display: flex; gap: 14px; justify-content: center;">
        <div style="padding: 16px 30px; border-radius: 20px; background: #FFF6E6; color: #161240; font-family: 'Baloo 2'; font-weight: 800; font-size: 17px; box-shadow: 0 6px 0 rgba(22,18,64,.35); display: flex; align-items: center; gap: 10px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#161240" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Yana urinish
        </div>
        <div style="padding: 16px 30px; border-radius: 20px; background: #161240; color: #FFF6E6; font-family: 'Baloo 2'; font-weight: 800; font-size: 17px; box-shadow: 0 6px 0 rgba(22,18,64,.45); display: flex; align-items: center; gap: 10px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF6E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
          Mavzularga qaytish
        </div>
      </div>

      <div style="text-align: center; margin-top: 22px;">
        <a href="#" style="font-weight: 800; font-size: 14px;">Keyingi blok: "To'liq o'nlik hosil qilib qo'shish" →</a>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
